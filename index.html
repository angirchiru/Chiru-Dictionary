<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chiru Dictionary</title><style>body{margin:0;background:#fffaf0;padding:16px;font-family:sans-serif}h1{color:#8b0000;text-align:center}input{width:100%;max-width:600px;padding:14px;border:2px solid #e6c9a8;border-radius:12px;display:block;margin:20px auto;font-size:16px}.card{background:#fff;border:1px solid #f0d9b5;border-radius:14px;padding:14px;margin:10px auto;max-width:600px}b{color:#8b0000;font-size:18px}.e{float:right;background:#8b0000;color:#fff;padding:4px 8px;border-radius:12px;font-size:12px}.m{background:#fff1db;padding:3px 8px;border-radius:10px;font-size:13px}</style></head><body><h1>Chiru Dictionary</h1><p style="text-align:center">Chiru - Manipuri - English | by Meila<br>44 words + Bible</p><input id="q" placeholder="Search Enro, Shimnu, Jesus..." oninput="f()"><div id="l"></div><p style="text-align:center;color:#888;margin-top:30px">Mapak nang awm! Kini ngai!</p><script>let w=[["Mahi behangbuk hi Abraham Shapa, David Shapa Jesu Christa thoinakeina kha inih","Abrahamgi macha, Davidgi macha Jesus Christagi hounarol","Matthew 1:1"],["Jesu Christa shokna kha hitihin ruawm","Jesus Christagi pokpa asumna thokhi","Matthew 1:18"],["Enro, shimnu khat na naivawng a shapa khat moshok rangnih, khan ama riming kha Imanuel ti pe u rangnih","Yeng u, leishabi amana angang mironduna macha nupa ama pokkani, magi mamingna Immanuel haina kougani","Matthew 1:23 Isaiah 7:14"],["Enro","Yeng oh","Behold Look"],["Shimnu","Leishabi","Virgin Young woman"],["Naivawng","Angang mironba","Pregnant With child"],["Shapa khat","Macha nupa ama","A son"],["Moshok rangnih","Pokkani","Will be born Will bear"],["Khatna","Amana","One A"],["Hitihin ruriei","Sumaina hairammi","Said like this"],["Nangri ming emoti?","Nanggi ming kari kouge?","What is your name?"],["Kiri ming Samungir ti","Eigi ming Samungir ni","My name is Samungir"],["Zingkar hoi","Nongale","Good morning"],["Zanpha Hoi","Nungaijaba","Good night"],["Kini ngai","Nungairiba","Be happy"],["Keina nang nawm konopawk","Ei nangbu nungsi","I love you"],["Etidannamo nang om?","Karamna leibage?","How are you?"],["Bumo nangnekjoi?","Chak charabra?","Did you eat?"],["Kenekjoi","Chak chare","I ate"],["Kei hongtang","Ei lakke","I will come"],["Nang kodeng nangse?","Kayda chatlige?","Where?"],["Tui","Ishing","Water"],["Mei","Mei","Fire"],["Aani var","Numit","Sun"],["Tha","Tha","Moon"],["Kunu","Ima","Mother"],["Kapaa","Ipa","Father"],["Inn","Yum","House"],["Khomun","Khul","Village"],["Sakchat","Chak","Food"],["Nompawk","Nungsi","Love"],["Kulenpa","Mou","Brother"],["Kulennu","Mou","Sister"],["Kolawmdit","Marup","Friend"],["Athajoi","Phajaba","Good"],["Athaboi","Phajaba natte","Bad"],["Aalen","Achouba","Big"],["Aasin","Apikpa","Small"],["Sero","Chatlu","Go"],["Hongro","Laklo","Come"],["Oh","Hoi","Yes"],["Naang","Natte","No"],["Mapak nang awm","Thagatchari","Thank you"],["Avon","Ngashi","Today"]];function f(){let q=document.getElementById('q').value.toLowerCase();let h="";w.forEach(x=>{if(x.join(' ').toLowerCase().includes(q)){h+=`<div class="card"><b>${x[0]}</b><br><span style="background:#8b0000;color:#fff;padding:4px 8px;border-radius:10px;font-size:12px">${x[2]}</span><br><span class="m">${x[1]}</span></div>`}});document.getElementById('l').innerHTML=h}f();</script></body></html>
